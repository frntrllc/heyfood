name: Post-release native smoke

run-name: Public native smoke v${{ inputs.version }}

on:
  workflow_call:
    inputs:
      version:
        description: GitHub Release version without the v prefix
        required: true
        type: string
      verify_hosted_installer:
        description: Verify and execute the hosted default installer after cutover
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: GitHub Release version without the v prefix
        required: true
        type: string
      verify_hosted_installer:
        description: Verify and execute the hosted default installer after cutover
        required: false
        default: true
        type: boolean

permissions:
  attestations: read
  contents: read

jobs:
  public-native:
    name: v${{ inputs.version }} / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    environment: native-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the public release assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir release
          gh release download "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'heyfood-*.tar.gz' \
            --pattern SHA256SUMS \
            --dir release
          native_state_release=$(
            awk -F '"' \
              '$1 == "readonly NATIVE_STATE_RELEASE_VERSION=" && NF == 3 { print $2 }' \
              install.sh
          )
          if [[ -n "$native_state_release" &&
            "$VERSION" == "$native_state_release" ]]; then
            gh release download "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'heyfood-*-native-state.json' \
              --dir release
          elif [[ "$VERSION" != "0.6.2" ]]; then
            echo "post-release smoke has no reviewed native-state boundary for v$VERSION" >&2
            exit 1
          fi
      - name: Verify checksums, archive policy, and signed provenance
        shell: bash
        run: |
          set -euo pipefail
          native_state_release=$(
            awk -F '"' \
              '$1 == "readonly NATIVE_STATE_RELEASE_VERSION=" && NF == 3 { print $2 }' \
              install.sh
          )
          if [[ -n "$native_state_release" &&
            "$VERSION" == "$native_state_release" ]]; then
            scripts/release/verify-assets.sh \
              release "$VERSION" --native-state
          else
            scripts/release/verify-assets.sh release "$VERSION"
          fi
          shopt -s nullglob
          assets=(release/*.tar.gz release/*.json release/SHA256SUMS)
          for asset in "${assets[@]}"; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Smoke the native public executable
        shell: bash
        env:
          HEYFOOD_APPLE_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
        run: |
          set -euo pipefail
          native_state_release=$(
            awk -F '"' \
              '$1 == "readonly NATIVE_STATE_RELEASE_VERSION=" && NF == 3 { print $2 }' \
              install.sh
          )
          if [[ -n "$native_state_release" &&
            "$VERSION" == "$native_state_release" ]]; then
            scripts/release/smoke.sh \
              release "$VERSION" "$TARGET" --native-state
          else
            scripts/release/smoke.sh release "$VERSION" "$TARGET"
          fi
      - name: Verify hosted installer provenance
        if: inputs.verify_hosted_installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir hosted-installer
          curl -qfsSL \
            --proto '=https' \
            --tlsv1.2 \
            --output hosted-installer/install.sh \
            https://hey.food/install.sh
          curl -qfsSL \
            --proto '=https' \
            --tlsv1.2 \
            --output hosted-installer/install.sh.sha256 \
            https://hey.food/install.sh.sha256
          cmp install.sh hosted-installer/install.sh
          cmp install.sh.sha256 hosted-installer/install.sh.sha256
          (
            cd hosted-installer
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -c install.sh.sha256
            else
              shasum -a 256 -c install.sh.sha256
            fi
          )
      - name: Install exact public version through the reviewed installer
        shell: bash
        run: |
          set -euo pipefail
          install_home="$RUNNER_TEMP/heyfood-home"
          install_bin="$RUNNER_TEMP/heyfood-bin"
          mkdir -p "$install_home" "$install_bin"
          chmod 0700 "$install_home" "$install_bin"
          HOME="$install_home" \
            HEYFOOD_BIN_DIR="$install_bin" \
            HEYFOOD_VERSION="$VERSION" \
            bash install.sh
          test "$("$install_bin/heyfood" --version)" = "heyfood $VERSION"
          "$install_bin/heyfood" --help >/dev/null
          "$install_bin/heyfood" logout --help >/dev/null
          rm "$install_bin/heyfood"
          test ! -e "$install_bin/heyfood"
      - name: Install through the public hosted default
        if: inputs.verify_hosted_installer
        shell: bash
        run: |
          set -euo pipefail
          install_home="$RUNNER_TEMP/heyfood-hosted-home"
          install_bin="$RUNNER_TEMP/heyfood-hosted-bin"
          mkdir -p "$install_home" "$install_bin"
          chmod 0700 "$install_home" "$install_bin"
          HOME="$install_home" \
            HEYFOOD_BIN_DIR="$install_bin" \
            bash hosted-installer/install.sh
          test "$("$install_bin/heyfood" --version)" = "heyfood $VERSION"
          "$install_bin/heyfood" --help >/dev/null
          "$install_bin/heyfood" logout --help >/dev/null
          rm "$install_bin/heyfood"
          test ! -e "$install_bin/heyfood"
