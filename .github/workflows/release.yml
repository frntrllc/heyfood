name: Release native CLI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

env:
  HEYFOOD_DISTRIBUTION_CHANNEL: release

jobs:
  validate:
    name: Validate exact release commit
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Refuse releases while native installation is suspended
        shell: bash
        run: |
          if grep -Fqx '# HEYFOOD_NATIVE_INSTALLATION_SUSPENDED=1' install.sh; then
            echo "Native distribution is suspended; replace the fail-closed installer before publishing another release." >&2
            exit 1
          fi
      - name: Match annotated tag, workspace version, and main
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          test "$tag_commit" = "$(git rev-parse HEAD)"
          test "$tag_commit" = "$(git rev-parse origin/main)"
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "heyfood-bin") | .version')
          test "$GITHUB_REF_NAME" = "v$version"
          if [[ "$version" == "0.6.2" ]]; then
            echo "v0.6.2 is immutable and predates native-state declaration/verifier assets; choose a new reviewed release version." >&2
            exit 1
          fi
          grep -Fqx "readonly SUPPORTED_VERSION=\"$version\"" install.sh
          grep -Fqx \
            "readonly NATIVE_STATE_RELEASE_VERSION=\"$version\"" \
            install.sh
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $GITHUB_REF_NAME; release assets are immutable." >&2
            exit 1
          fi
          {
            printf 'commit=%s\n' "$tag_commit"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"
      - name: Install the Linux Secret Service fixture
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libdbus-1-dev pkg-config
      - name: Test the exact default native workspace and broker composition
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "\n" | gnome-keyring-daemon --unlock
            cargo test --workspace --locked --all-targets
          '
      - name: Test the secondary portable workspace
        run: cargo test --workspace --locked --all-targets --no-default-features

  publish:
    name: Publish approved protected candidate
    needs: validate
    runs-on: ubuntu-22.04
    environment: native-release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      APPROVED_RUN_ID: ${{ vars.HEYFOOD_APPROVED_CANDIDATE_RUN_ID }}
      APPROVED_SHA256SUMS_SHA256: ${{ vars.HEYFOOD_APPROVED_CANDIDATE_SHA256SUMS_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the exact approved protected release set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "native-release must bind an approved protected candidate run ID" >&2
            exit 78
          }
          [[ "$APPROVED_SHA256SUMS_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "native-release must bind the approved SHA256SUMS SHA-256" >&2
            exit 78
          }

          run_json="$RUNNER_TEMP/approved-run.json"
          artifact_json="$RUNNER_TEMP/approved-artifact.json"
          gh api \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$APPROVED_RUN_ID" \
            >"$run_json"
          jq -e \
            --arg run_id "$APPROVED_RUN_ID" \
            --arg commit "$RELEASE_COMMIT" \
            '(.id | tostring) == $run_id
             and .event == "workflow_dispatch"
             and .status == "completed"
             and .conclusion == "success"
             and .head_sha == $commit
             and .path == ".github/workflows/ci.yml"
             and .name == "Native CLI CI"' \
            "$run_json" >/dev/null

          gh api \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$APPROVED_RUN_ID/artifacts?name=protected-candidate-release-set&per_page=100" \
            >"$artifact_json"
          jq -e \
            --arg run_id "$APPROVED_RUN_ID" \
            --arg commit "$RELEASE_COMMIT" \
            '.total_count == 1
             and (.artifacts | length) == 1
             and .artifacts[0].name == "protected-candidate-release-set"
             and .artifacts[0].expired == false
             and .artifacts[0].size_in_bytes > 0
             and (.artifacts[0].workflow_run.id | tostring) == $run_id
             and .artifacts[0].workflow_run.head_sha == $commit' \
            "$artifact_json" >/dev/null

          mkdir dist
          gh run download "$APPROVED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name protected-candidate-release-set \
            --dir dist

          observed_manifest_sha256=$(sha256sum dist/SHA256SUMS | awk '{print $1}')
          test "$observed_manifest_sha256" = "$APPROVED_SHA256SUMS_SHA256"
          scripts/release/verify-assets.sh dist "$VERSION" --native-state
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" -eq 10
          test "$(wc -l <dist/SHA256SUMS | tr -d '[:space:]')" -eq 9
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.json dist/SHA256SUMS)
          test "${#assets[@]}" -eq 10
          for asset in "${assets[@]}"; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Attest every release asset
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.json
            dist/SHA256SUMS
      - name: Create the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.tar.gz dist/*.json dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "heyfood v$VERSION" \
            --generate-notes

  post-release-smoke:
    name: Public native artifact smoke
    needs: [validate, publish]
    permissions:
      attestations: read
      contents: read
    uses: ./.github/workflows/post-release-smoke.yml
    with:
      version: ${{ needs.validate.outputs.version }}
