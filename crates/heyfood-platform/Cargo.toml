[package]
name = "heyfood-platform"
description = "Native configuration, credential, browser, clock, and signal adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
native-credentials = ["dep:keyring", "dep:sysinfo"]
qualification-credentials = ["native-credentials"]

[dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
chacha20poly1305.workspace = true
directories.workspace = true
fs2.workspace = true
heyfood-application = { version = "=0.8.0", path = "../heyfood-application" }
heyfood-core = { version = "=0.8.0", path = "../heyfood-core" }
hkdf.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
sysinfo = { workspace = true, features = ["system"], optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["attributes", "std"] }
time = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["serde", "std", "v4"] }
webbrowser = { workspace = true, features = ["hardened"] }
zeroize = { workspace = true, features = ["alloc", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, optional = true, features = ["crypto-rust", "linux-native-sync-persistent"] }

[target.'cfg(target_os = "windows")'.dependencies]
heyfood-windows-file = { version = "=0.8.0", path = "../heyfood-windows-file" }
keyring = { workspace = true, optional = true, features = ["windows-native"] }

[dev-dependencies]
proptest = { workspace = true, features = ["std"] }

[lints]
workspace = true
