[package]
name = "heyfood-bin"
description = "Native heyfood executable composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "heyfood"
path = "src/main.rs"

[features]
default = ["native-credentials"]
native-credentials = [
    "heyfood-agent-contract/native-credentials",
    "heyfood-platform/native-credentials",
]
native-audio = ["heyfood-agent-contract/native-audio", "heyfood-voice/native-audio"]

[dependencies]
heyfood-agent-contract = { version = "=0.8.0", path = "../heyfood-agent-contract" }
heyfood-agent-runtime = { version = "=0.8.0", path = "../heyfood-agent-runtime" }
heyfood-agent-setup = { version = "=0.8.0", path = "../heyfood-agent-setup" }
heyfood-application = { version = "=0.8.0", path = "../heyfood-application" }
heyfood-cli = { version = "=0.8.0", path = "../heyfood-cli" }
heyfood-core = { version = "=0.8.0", path = "../heyfood-core" }
heyfood-mcp = { version = "=0.8.0", path = "../heyfood-mcp" }
heyfood-platform = { version = "=0.8.0", path = "../heyfood-platform" }
heyfood-tui = { version = "=0.8.0", path = "../heyfood-tui" }
heyfood-voice = { version = "=0.8.0", path = "../heyfood-voice" }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { workspace = true, features = ["rt"] }

[target.'cfg(windows)'.dependencies]
heyfood-platform = { version = "=0.8.0", path = "../heyfood-platform", features = ["native-credentials"] }

[dev-dependencies]
clap = { workspace = true, features = ["derive", "std"] }
jsonschema = { version = "=0.49.2", default-features = false }
portable-pty.workspace = true
ratatui = { workspace = true, features = ["crossterm"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
tar.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
unicode-width.workspace = true
uuid = { workspace = true, features = ["std", "v4"] }

[target.'cfg(windows)'.dev-dependencies]
heyfood-platform = { version = "=0.8.0", path = "../heyfood-platform", features = ["qualification-credentials"] }

[lints]
workspace = true
