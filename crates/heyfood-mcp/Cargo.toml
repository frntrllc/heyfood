[package]
name = "heyfood-mcp"
description = "Bounded, read-only local MCP server for heyfood."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
heyfood-agent-contract = { version = "=0.6.1", path = "../heyfood-agent-contract" }
heyfood-application = { version = "=0.6.1", path = "../heyfood-application" }
heyfood-core = { version = "=0.6.1", path = "../heyfood-core" }
jsonschema = { version = "=0.49.2", default-features = false }
rmcp = { workspace = true, features = ["server"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "io-std", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
