[package]
name = "heyfood-agent-setup"
description = "Conflict-safe, reversible installation for heyfood Agent Skills."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cap-std.workspace = true
cap-fs-ext.workspace = true
directories.workspace = true
fs2.workspace = true
heyfood-platform = { version = "=0.6.3", path = "../heyfood-platform" }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }

[target.'cfg(windows)'.dependencies]
heyfood-windows-file = { version = "=0.6.3", path = "../heyfood-windows-file" }

[dev-dependencies]
jsonschema = { version = "=0.49.2", default-features = false }

[lints]
workspace = true
